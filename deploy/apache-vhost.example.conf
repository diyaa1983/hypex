# مثال VirtualHost لـ Apache — ضع Static IP مكان YOUR_STATIC_IP
# انسخ إلى: /etc/apache2/sites-available/hypex.conf
# ثم: a2ensite hypex && systemctl reload apache2

<VirtualHost *:80>
    ServerName YOUR_STATIC_IP
    DocumentRoot /var/www/hypex

    <Directory /var/www/hypex>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # حماية إضافية (config محمية أيضاً عبر config/.htaccess)
    <Directory /var/www/hypex/config>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/hypex-error.log
    CustomLog ${APACHE_LOG_DIR}/hypex-access.log combined
</VirtualHost>
