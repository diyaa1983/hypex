name: namma_mobile
description: تطبيق Hypex للمبيعات والمندوبين (Flutter) — يتصل بالسيرفر عبر واجهات JSON.
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  open_filex: ^4.7.0
  flutter_foreground_task: ^10.0.0
  flutter_local_notifications: ^18.0.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  printing: ^5.15.0
  print_bluetooth_thermal: ^1.2.2
  esc_pos_utils_plus: ^2.0.4
  image: ^4.9.1
  android_intent_plus: ^6.1.0
  pdf: ^3.13.0
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # ملفات assets/icon تُستخدم لتوليد أيقونة التطبيق فقط ولا تُحزَّم داخل التطبيق.
  assets:
    - assets/branding/
    - assets/fonts/
    - assets/tiles/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  min_sdk_android: 23

